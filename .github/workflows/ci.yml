name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ShellCheck
        run: shellcheck -x bin/* lib/config.sh tests/run.sh
      - name: Skills have front matter
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for path in glob.glob(".claude/skills/*/SKILL.md"):
              text = open(path).read()
              parts = text.split("---", 2)
              meta = yaml.safe_load(parts[1]) if text.startswith("---") and len(parts) == 3 else None
              if not isinstance(meta, dict) or not meta.get("name") or not meta.get("description"):
                  bad.append(path)
          print("\n".join(bad) or "ok")
          sys.exit(1 if bad else 0)
          PY
      - name: Python syntax
        run: python3 -m py_compile lib/ota_tools.py
      - name: Tests
        run: tests/run.sh
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .
